<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NATCODEV Mobile</title>
  <style>
    :root { --primary:#1a5276; --green:#1f8a55; --green-dark:#166b41; --ink:#1f2937; --muted:#667085; --line:#d8e2dc; }
    * { box-sizing:border-box; }
    body {
      margin:0;
      font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color:var(--ink);
      background:linear-gradient(135deg, rgba(26,82,118,.08), rgba(31,138,85,.10)), #f5f8f6;
      min-height:100vh;
    }
    header {
      background:#fff;
      border-bottom:1px solid rgba(16,24,40,.08);
      box-shadow:0 8px 24px rgba(16,24,40,.06);
    }
    .bar, main { max-width:1100px; margin:0 auto; padding:22px; }
    .bar { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand { color:var(--primary); font-weight:800; letter-spacing:.02em; }
    .home-link { color:var(--green-dark); text-decoration:none; font-weight:800; }
    .hero { padding-top:30px; padding-bottom:10px; }
    h1 { color:var(--primary); font-size:clamp(2rem, 5vw, 3.2rem); line-height:1.08; margin:0 0 10px; }
    .lead { color:var(--muted); max-width:680px; margin:0; font-size:1.05rem; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; margin-top:24px; }
    section {
      background:#fff;
      border:1px solid rgba(16,24,40,.08);
      border-radius:8px;
      padding:22px;
      box-shadow:0 14px 34px rgba(16,24,40,.10);
    }
    h2 { color:var(--primary); margin:0 0 14px; }
    article { border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; background:#fbfcfb; }
    article strong { display:block; color:var(--ink); margin-bottom:6px; }
    article p { color:var(--muted); margin:0 0 8px; }
    article small { color:var(--green-dark); font-weight:800; }
    [data-alert] { max-width:1100px; margin:18px auto 0; padding:0 22px 26px; color:var(--green-dark); font-weight:800; }
    @media (max-width:760px) { .bar { align-items:flex-start; flex-direction:column; } .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand">NATCODEV Mobile</div>
      <a class="home-link" href="../index.php">Back to home</a>
    </div>
  </header>
  <main>
    <div class="hero">
      <h1>Offline-ready registry access</h1>
      <p class="lead">Browse marketplace updates and training sessions with cached data support for low-connectivity field conditions.</p>
    </div>
    <div class="grid">
      <section>
        <h2>Marketplace</h2>
        <div data-marketplace></div>
      </section>
      <section>
        <h2>Webinars</h2>
        <div data-webinars></div>
      </section>
    </div>
  </main>
  <p data-alert></p>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
