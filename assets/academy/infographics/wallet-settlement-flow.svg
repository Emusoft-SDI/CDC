<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="finShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#finBg)"/>

  <!-- Title Header -->
  <text x="480" y="44" text-anchor="middle" fill="#FACC15" font-family="Arial, sans-serif" font-weight="900" font-size="13" letter-spacing="2">FINANCIAL INFRASTRUCTURE &amp; LEDGER FLOW</text>
  <text x="480" y="76" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-weight="bold" font-size="24">NATCODEV Wallet &amp; Escrow Settlement Architecture</text>
  <text x="480" y="100" text-anchor="middle" fill="#A7F3D0" font-family="Arial, sans-serif" font-size="13">Reserved virtual bank accounts, held escrow balances, automated Monnify webhook reconciliation</text>

  <!-- Flow connecting arrows -->
  <path d="M 160 225 L 800 225" stroke="#34D399" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- STEP 1: Reserved Virtual Account -->
  <g transform="translate(50, 130)" filter="url(#finShadow)">
    <rect width="200" height="270" rx="12" fill="#FFFFFF" stroke="#34D399" stroke-width="2"/>
    <circle cx="100" cy="46" r="28" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="100" y="55" text-anchor="middle" font-size="22">🏦</text>
    <rect x="20" y="88" width="160" height="22" rx="11" fill="#047857"/>
    <text x="100" y="103" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="10">STEP 1: DEDICATED VA</text>
    <text x="100" y="130" text-anchor="middle" fill="#064E3B" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Virtual Bank Account</text>
    <text x="18" y="156" fill="#334155" font-family="Arial, sans-serif" font-size="11">
      <tspan x="18" dy="0">• Auto-assigned per user ID</tspan>
      <tspan x="18" dy="16">• Compatible with all banks</tspan>
      <tspan x="18" dy="16">• Instant credit notification</tspan>
      <tspan x="18" dy="16">• Zero manual reconciliation</tspan>
    </text>
    <rect x="18" y="234" width="164" height="20" rx="4" fill="#D1FAE5"/>
    <text x="100" y="248" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-weight="bold" font-size="9.5">Direct NIP Transfer</text>
  </g>

  <!-- STEP 2: Balance Segmentation -->
  <g transform="translate(285, 130)" filter="url(#finShadow)">
    <rect width="200" height="270" rx="12" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="100" cy="46" r="28" fill="#F0F9FF" stroke="#0284C7" stroke-width="2"/>
    <text x="100" y="55" text-anchor="middle" font-size="22">⚖️</text>
    <rect x="20" y="88" width="160" height="22" rx="11" fill="#0284C7"/>
    <text x="100" y="103" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="10">STEP 2: SEGREGATION</text>
    <text x="100" y="130" text-anchor="middle" fill="#0C4A6E" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Ledger Separation</text>
    <text x="18" y="156" fill="#334155" font-family="Arial, sans-serif" font-size="11">
      <tspan x="18" dy="0">• Available Balance (Free)</tspan>
      <tspan x="18" dy="16">• Held Balance (In Escrow)</tspan>
      <tspan x="18" dy="16">• Locks for ordered inputs</tspan>
      <tspan x="18" dy="16">• Dispute safety protection</tspan>
    </text>
    <rect x="18" y="234" width="164" height="20" rx="4" fill="#E0F2FE"/>
    <text x="100" y="248" text-anchor="middle" fill="#0369A1" font-family="Arial, sans-serif" font-weight="bold" font-size="9.5">Dual-Ledger Security</text>
  </g>

  <!-- STEP 3: Fulfilment & Release -->
  <g transform="translate(520, 130)" filter="url(#finShadow)">
    <rect width="200" height="270" rx="12" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="100" cy="46" r="28" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="100" y="55" text-anchor="middle" font-size="22">📦</text>
    <rect x="20" y="88" width="160" height="22" rx="11" fill="#D97706"/>
    <text x="100" y="103" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="10">STEP 3: VERIFICATION</text>
    <text x="100" y="130" text-anchor="middle" fill="#78350F" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Delivery &amp; Confirm</text>
    <text x="18" y="156" fill="#334155" font-family="Arial, sans-serif" font-size="11">
      <tspan x="18" dy="0">• Input received by grower</tspan>
      <tspan x="18" dy="16">• OTP release confirmation</tspan>
      <tspan x="18" dy="16">• Escrow hold clears</tspan>
      <tspan x="18" dy="16">• Provider credited in full</tspan>
    </text>
    <rect x="18" y="234" width="164" height="20" rx="4" fill="#FEF3C7"/>
    <text x="100" y="248" text-anchor="middle" fill="#B45309" font-family="Arial, sans-serif" font-weight="bold" font-size="9.5">Buyer Sign-Off Flow</text>
  </g>

  <!-- STEP 4: Automated Payout -->
  <g transform="translate(755, 130)" filter="url(#finShadow)">
    <rect width="170" height="270" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
    <circle cx="85" cy="46" r="28" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <text x="85" y="55" text-anchor="middle" font-size="22">💸</text>
    <rect x="15" y="88" width="140" height="22" rx="11" fill="#059669"/>
    <text x="85" y="103" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-weight="bold" font-size="10">STEP 4: SETTLEMENT</text>
    <text x="85" y="130" text-anchor="middle" fill="#064E3B" font-family="Arial, sans-serif" font-weight="bold" font-size="13">Disbursement</text>
    <text x="14" y="156" fill="#334155" font-family="Arial, sans-serif" font-size="11">
      <tspan x="14" dy="0">• Real-time bank transfer</tspan>
      <tspan x="14" dy="16">• Full transaction receipt</tspan>
      <tspan x="14" dy="16">• In-app ticket audit trail</tspan>
      <tspan x="14" dy="16">• Central Bank compliant</tspan>
    </text>
    <rect x="14" y="234" width="142" height="20" rx="4" fill="#D1FAE5"/>
    <text x="85" y="248" text-anchor="middle" fill="#065F46" font-family="Arial, sans-serif" font-weight="bold" font-size="9.5">T+0 Settlement</text>
  </g>

  <text x="480" y="445" text-anchor="middle" fill="#FACC15" font-family="Arial, sans-serif" font-size="12">🔒 Transparency Promise: Zero cash-in-hand transactions. Every kobo is verified against delivery evidence and digital receipts.</text>
</svg>
